<html>
<head> <title>Even or Odd Checker</title> </head>
<body>
    <h2>Even or Odd Number Checker</h2>
    <script>
        function checkEvenOdd(number) {
            if(number % 2 === 0) {
                return "Even";
            } else {
                return "Odd"; 	}}
        let testNumber1 = 33;
        let testNumber2 = 97;
        let testNumber3 = 18;
        document.write(`${testNumber1} is ${checkEvenOdd(testNumber1)}<br>`);
        document.write(`${testNumber2} is ${checkEvenOdd(testNumber2)}<br>`);
        document.write(`${testNumber3} is ${checkEvenOdd(testNumber3)}<br>`);
    </script>
</body>
</html>
