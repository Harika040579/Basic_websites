<html>
<head> <title>Find the Biggest Among Three Numbers</title> </head>
<body>   <h3>Find the Biggest Among Three Numbers</h3>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="number" id="num3" placeholder="Enter third number">
    <button onclick="findBiggest()">Compare</button> <br>
    <div id="result"></div>  <script>
        function findBiggest() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let num3 = parseFloat(document.getElementById("num3").value);
            let resultDiv = document.getElementById("result");
            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                resultDiv.innerText = "Please enter valid numbers.";
                return;	}
            let biggest;
            if (num1 >= num2 && num1 >= num3) {
                biggest = num1;	} else if (num2 >= num1 && num2 >= num3) {
                biggest = num2;
            } else {
                biggest = num3; 	}
 resultDiv.innerText = `${biggest} is the biggest number.`; 
	}  
</script> 
</body>   
</html>
