<html>
<head>
<title>Add 2 numbers</title>
</head>
<body>
<h3>Addition Of 2 Numbers</h3>
<script>
let x = Number(prompt("Enter the value 0f x:"));
let y = Number(prompt("Enter the value 0f y:"));
let Sum = x+y;
document.write("Value of x is: "+x +'<br>');
document.write("Value of y is: "+y +'<br>');
document.write("Addition of two numbers is: "+Sum);
</script>
</body>
</html>
