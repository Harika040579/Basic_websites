<html>
<body>
<h3>SPY Checker</h3>
<script>
var x = 1124;
var temp = x;
var sum = 0;
var product = 1;
while (temp > 0) {
  var digit = temp % 10;
  sum = sum + digit;
  product = product * digit;
  temp = Math.floor(temp / 10);
}
document.write('<p>x is: ' + x);
if (sum == product) {
  document.write("<p>" + x + " is a Spy number.");
} else {
  document.write("<p>" + x + " is not a Spy number.");
}

</script>
</body>
</html>
