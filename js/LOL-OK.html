<!DOCTYPE html>
<html>
<head>
  <title>LOL-OK FizzBuzz</title>
</head>
<body>

<h2>LOL-OK Game Output:</h2>
<pre id="output"></pre>

<script>
  let result = "";

  for (let i = 1; i <= 100; i++) {
    if (i % 3 === 0 && i % 5 === 0) {
      result += "LOL-OK\n";
    } else if (i % 3 === 0) {
      result += "LOL\n";
    } else if (i % 5 === 0) {
      result += "OK\n";
    } else {
      result += i + "\n";
    }
  }

  document.getElementById("output").innerText = result;
</script>

</body>
</html>
