<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS in Body Tag</title>
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="text-align: center; color: #4CAF50; font-family: Arial, sans-serif;">Welcome to My Garden</h1>

    <!-- Internal CSS in the body -->
    <style>
        .garden {
            background-color: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px auto;
            width: 80%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .garden img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
        .garden p {
            font-size: 1.2em;
            color: #2e7d32;
        }
    </style>

    <div class="garden">
        <img src="https://via.placeholder.com/400" alt="Garden Image">
        <p>This is a beautiful garden with lush greenery and colorful flowers. Enjoy the serenity!</p>
    </div>
</body>
</html>
