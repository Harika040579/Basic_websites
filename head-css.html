<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS in Head Tag</title>
    <!-- Internal CSS in the head -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .beach {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .beach img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
        .beach h2 {
            color: #0077b6;
        }
        .beach p {
            font-size: 1.1em;
            color: #023e8a;
        }
    </style>
</head>
<body>
    <div class="beach">
        <h2>Welcome to the Beach</h2>
        <img src="https://via.placeholder.com/400" alt="Beach Image">
        <p>Relax and enjoy the soothing waves and golden sand. Perfect for a sunny day!</p>
    </div>
</body>
</html>
